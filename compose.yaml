name: sh-soloinventory
services:
  app:
    image: ${SOLOINVENTORY_IMAGE:-ghcr.io/metalogico/soloinventory:1.0.0}
    restart: unless-stopped
    init: true
    mem_limit: 512m
    env_file: ${SOLOINVENTORY_ENV_FILE:-.env}
    environment:
      APP_NAME: SoloInventory
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/soloinventory.sqlite
      SESSION_DRIVER: file
      SESSION_COOKIE: soloinventory_session
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      BCRYPT_ROUNDS: "12"
    ports:
      - "${SOLOINVENTORY_BIND_IP:-127.0.0.1}:${SOLOINVENTORY_HTTP_PORT:-8091}:8080"
    volumes:
      - data:/var/www/html/storage
      - backups:/backups
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  data:
  backups:
