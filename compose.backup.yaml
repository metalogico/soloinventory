services:
  backup:
    extends:
      file: compose.yaml
      service: app
    user: "0:0"
    command: ["sh", "/var/www/html/docker/backup-entrypoint.sh"]
    ports: !reset []
    network_mode: none
    mem_limit: 192m
    environment:
      SOLOINVENTORY_SCHEDULED_BACKUPS: "true"
      CACHE_FILE_PATH: /var/www/html/storage/framework/backup-cache/data
      CACHE_LOCK_PATH: /var/www/html/storage/framework/backup-cache/locks
    volumes:
      - type: bind
        source: ${SOLOINVENTORY_BACKUP_DIR:?Set SOLOINVENTORY_BACKUP_DIR in the private env}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: .
        target: /source
        read_only: true
      - tls:/tls:ro
    depends_on:
      https:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "/var/www/html/docker/backup-health.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
